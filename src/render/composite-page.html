<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Mountain Finder — compositor page</title>
    <style>
      html,
      body {
        margin: 0;
        background: #101214;
      }
      img {
        display: block;
        max-width: 100%;
      }
    </style>
  </head>
  <body>
    <!--
      A page whose only job is to expose the REAL compositor to a script driving
      this browser (scripts/rasterise.ts, used by `npm run demo`).

      Why a page at all: `src/render/composite.ts` needs `Image`, `<canvas>` and
      `toBlob`, so a PNG has to be produced by a browser. The alternative would
      be re-implementing compositing in Node — a second implementation that
      would quietly disagree with the one the app ships. Instead the demo drives
      the same module the app calls, served as a real ES module by Vite.

      Not part of the app: nothing links here, and the app's own entry point is
      index.html.
    -->
    <div id="mount"></div>
    <script type="module">
      import { compositeToPngDataUrl, svgToDataUrl } from '/src/render/composite.ts';

      /**
       * Parse an SVG and report any error the browser finds. `drawImage` on a
       * malformed SVG fails silently — a blank layer, no exception — so both
       * inputs are checked before they are drawn.
       */
      function svgParseError(svg, label) {
        const parsed = new DOMParser().parseFromString(svg, 'image/svg+xml');
        const error = parsed.querySelector('parsererror');
        return error === null ? null : `${label}: ${error.textContent.trim().slice(0, 300)}`;
      }

      window.mfComposite = async ({ backdropSvg, backdropDataUrl, overlaySvg, widthPx, heightPx }) => {
        // A backdrop is EITHER a synthetic silhouette (SVG, from `npm run
        // demo`) or a real photograph (an image data: URL, from `npm run
        // annotate`). A photograph goes straight to the compositor: wrapping
        // a 4 MB JPEG in an SVG and base64-ing the result twice costs ~10 MB
        // of string for nothing, and it is the compositor's `photoSrc`
        // parameter that this is for.
        const problem =
          (backdropDataUrl === undefined ? svgParseError(backdropSvg, 'backdrop') : null) ??
          svgParseError(overlaySvg, 'overlay');
        if (problem !== null) throw new Error(problem);

        // NOTE: `svgToDataUrl`, not a local re-implementation. This line used
        // to read `String.fromCharCode(...new TextEncoder().encode(svg))`,
        // which spreads one argument per byte and dies with "Maximum call
        // stack size exceeded" somewhere north of a hundred kilobytes — never
        // hit while every backdrop was a small synthetic silhouette, hit
        // immediately by the first real photograph. composite.ts has always
        // done this with a loop; this page had a second copy that did not.
        const photoSrc = backdropDataUrl ?? svgToDataUrl(backdropSvg);
        const pngDataUrl = await compositeToPngDataUrl({
          photoSrc,
          overlaySvg,
          widthPx,
          heightPx,
        });

        const preview = document.createElement('img');
        preview.src = pngDataUrl;
        document.getElementById('mount').replaceChildren(preview);
        return pngDataUrl;
      };

      window.mfCompositeReady = true;
    </script>
  </body>
</html>
